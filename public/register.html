<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Employee Registration</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .container {

            width: 90%;

            max-width: 500px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.2);

        }


        h1 {

            text-align: center;

            margin-top: 0;

            color: #1f2937;

        }


        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 25px;

            font-size: 14px;

        }


        .form-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 7px;

            color: #333;

        }


        input,
        select {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 14px;

        }


        input:focus,
        select:focus {

            outline: none;

            border-color: #667eea;

        }


        .register-btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 6px;

            background: #6d3fc0;

            color: white;

            font-size: 16px;

            cursor: pointer;

            margin-top: 5px;

        }


        .register-btn:hover {

            background: #5932a3;

        }


        .register-btn:disabled {

            background: #999;

            cursor: not-allowed;

        }


        .message {

            margin-top: 15px;

            padding: 12px;

            border-radius: 6px;

            display: none;

            text-align: center;

        }


        .success {

            background: #dcfce7;

            color: #166534;

        }


        .error {

            background: #fee2e2;

            color: #991b1b;

        }


        .login-link {

            text-align: center;

            margin-top: 20px;

            font-size: 14px;

        }


        .login-link a {

            color: #6d3fc0;

            text-decoration: none;

            font-weight: bold;

        }


        .login-link a:hover {

            text-decoration: underline;

        }


        .security-note {

            background: #f3f4f6;

            padding: 12px;

            border-radius: 6px;

            margin-bottom: 20px;

            font-size: 13px;

            color: #555;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        Employee Registration
    </h1>


    <p class="subtitle">
        Create your Employee account
    </p>



    <form id="registerForm">


        <!-- Employee ID -->

        <div class="form-group">

            <label for="employeeId">
                Employee ID
            </label>

            <input
                type="text"
                id="employeeId"
                placeholder="Example: EMP001"
                required>

        </div>


        <!-- Name -->

        <div class="form-group">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required>

        </div>


        <!-- Email -->

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="example@gmail.com"
                required>

        </div>


        <!-- Password -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required>

        </div>


        <!-- Department -->

        <div class="form-group">

            <label for="department">
                Department
            </label>

            <select
                id="department"
                required>

                <option value="">
                    Select Department
                </option>

                <option value="CSE">
                    CSE
                </option>

                <option value="ECE">
                    ECE
                </option>

                <option value="EEE">
                    EEE
                </option>

                <option value="IT">
                    IT
                </option>

                <option value="MECH">
                    MECH
                </option>

                <option value="CIVIL">
                    CIVIL
                </option>

                <option value="MBA">
                    MBA
                </option>

                <option value="HR">
                    HR
                </option>

                <option value="Finance">
                    Finance
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <!-- Fixed Role -->

        <div class="form-group">

            <label>
                Account Role
            </label>

            <input
                type="text"
                value="Employee"
                disabled>

        </div>


        <button
            type="submit"
            class="register-btn"
            id="registerButton">

            Register

        </button>


    </form>


    <div
        id="message"
        class="message">
    </div>


    <div class="login-link">

        Already have an account?

        <a href="index.html">
            Login here
        </a>

    </div>


</div>


<script>


document.getElementById(
    "registerForm"
).addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const employeeId =
            document.getElementById(
                "employeeId"
            ).value.trim();


        const name =
            document.getElementById(
                "name"
            ).value.trim();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        const department =
            document.getElementById(
                "department"
            ).value;


        const button =
            document.getElementById(
                "registerButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        message.style.display =
            "none";


        // ----------------------------------------------------
        // Basic validation
        // ----------------------------------------------------

        if (
            !employeeId ||
            !name ||
            !email ||
            !password ||
            !department
        ) {

            showMessage(
                "Please fill in all required fields.",
                false
            );

            return;

        }


        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters.",
                false
            );

            return;

        }


        button.disabled =
            true;

        button.textContent =
            "Registering...";


        try {


            // ------------------------------------------------
            // Send registration request
            //
            // Notice:
            // There is NO role field here.
            // Backend automatically creates Employee.
            // ------------------------------------------------

            const response =
                await fetch(
                    "/api/auth/register",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                employeeId:
                                    employeeId,

                                name:
                                    name,

                                email:
                                    email,

                                password:
                                    password,

                                department:
                                    department

                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Registration failed"
                );

            }


            showMessage(
                data.message ||
                "Registration successful.",
                true
            );


            document.getElementById(
                "registerForm"
            ).reset();


            // ------------------------------------------------
            // Redirect to login after 2 seconds
            // ------------------------------------------------

            setTimeout(
                function () {

                    window.location.href =
                        "index.html";

                },
                2000
            );


        } catch (error) {

            console.error(
                "Registration error:",
                error
            );


            showMessage(
                error.message ||
                "Registration failed.",
                false
            );


        } finally {

            button.disabled =
                false;

            button.textContent =
                "Register";

        }

    }
);


/* ==========================================================
   SHOW MESSAGE
========================================================== */

function showMessage(
    text,
    success
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.style.display =
        "block";


    message.className =
        success
            ? "message success"
            : "message error";

}


</script>


</body>

</html>

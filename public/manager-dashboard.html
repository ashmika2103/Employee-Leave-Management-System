<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manager Dashboard - ELMS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        .header {
            background: #1f4e79;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #b02a37;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 30px auto;
        }

        .welcome-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .welcome-card h2 {
            margin-top: 0;
            color: #1f4e79;
        }

        .manager-info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .info-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }

        .info-box strong {
            display: block;
            color: #555;
            margin-bottom: 5px;
        }

        .filter-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .filter-section label {
            font-weight: bold;
            margin-right: 10px;
        }

        .filter-section select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            min-width: 180px;
        }

        .table-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        .table-card h2 {
            margin-top: 0;
            color: #1f4e79;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: #1f4e79;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8f9fa;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .approved {
            background: #d1e7dd;
            color: #0f5132;
        }

        .rejected {
            background: #f8d7da;
            color: #842029;
        }

        .action-buttons {
            white-space: nowrap;
        }

        .approve-btn {
            background: #198754;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .approve-btn:hover {
            background: #146c43;
        }

        .reject-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .reject-btn:hover {
            background: #b02a37;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;
        }

        .error {
            background: #f8d7da;
            color: #842029;
        }

        @media (max-width: 900px) {

            .manager-info {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .manager-info {
                grid-template-columns: 1fr;
            }

            .container {
                width: 98%;
            }

        }

    </style>

</head>


<body>


    <!-- Header -->

    <div class="header">

        <h1>
            Employee Leave Management System
        </h1>

        <button
            class="logout-btn"
            onclick="logout()">

            Logout

        </button>

    </div>


    <!-- Main Container -->

    <div class="container">


        <!-- Manager Information -->

        <div class="welcome-card">

            <h2>
                Manager Dashboard
            </h2>

            <p>
                Welcome,
                <strong id="managerName">
                    Manager
                </strong>
            </p>


            <div class="manager-info">

                <div class="info-box">

                    <strong>
                        Employee ID
                    </strong>

                    <span id="managerId">
                        -
                    </span>

                </div>


                <div class="info-box">

                    <strong>
                        Email
                    </strong>

                    <span id="managerEmail">
                        -
                    </span>

                </div>


                <div class="info-box">

                    <strong>
                        Department
                    </strong>

                    <span id="managerDepartment">
                        -
                    </span>

                </div>


                <div class="info-box">

                    <strong>
                        Role
                    </strong>

                    <span id="managerRole">
                        Manager
                    </span>

                </div>

            </div>

        </div>


        <!-- Message -->

        <div
            id="message"
            class="message">
        </div>


        <!-- Filter -->

        <div class="filter-section">

            <label for="statusFilter">
                Filter Leave Requests:
            </label>

            <select
                id="statusFilter"
                onchange="filterLeaves()">

                <option value="All">
                    All
                </option>

                <option value="Pending">
                    Pending
                </option>

                <option value="Approved">
                    Approved
                </option>

                <option value="Rejected">
                    Rejected
                </option>

            </select>

        </div>


        <!-- Leave Requests -->

        <div class="table-card">

            <h2>
                Employee Leave Requests
            </h2>


            <table>

                <thead>

                    <tr>

                        <th>
                            Employee ID
                        </th>

                        <th>
                            Employee Name
                        </th>

                        <th>
                            Leave Type
                        </th>

                        <th>
                            From Date
                        </th>

                        <th>
                            To Date
                        </th>

                        <th>
                            Days
                        </th>

                        <th>
                            Reason
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="leaveTableBody">

                </tbody>

            </table>

        </div>


    </div>


<script>


    // ============================================
    // GET LOGIN INFORMATION
    // ============================================

    const token =
        localStorage.getItem("token");


    const currentUser =
        JSON.parse(
            localStorage.getItem("currentUser")
        );


    // ============================================
    // LOGIN CHECK
    // ============================================

    if (
        !token ||
        !currentUser
    ) {

        window.location.href =
            "index.html";

    }


    // ============================================
    // ROLE CHECK
    // ============================================

    if (
        currentUser &&
        currentUser.role !== "Manager"
    ) {

        if (
            currentUser.role ===
            "Administrator"
        ) {

            window.location.href =
                "admin-dashboard.html";

        } else {

            window.location.href =
                "employee-dashboard.html";

        }

    }


    // ============================================
    // DISPLAY MANAGER INFORMATION
    // ============================================

    if (currentUser) {

        document.getElementById(
            "managerName"
        ).textContent =
            currentUser.name || "-";


        document.getElementById(
            "managerId"
        ).textContent =
            currentUser.employeeId || "-";


        document.getElementById(
            "managerEmail"
        ).textContent =
            currentUser.email || "-";


        document.getElementById(
            "managerDepartment"
        ).textContent =
            currentUser.department || "-";


        document.getElementById(
            "managerRole"
        ).textContent =
            currentUser.role || "Manager";

    }


    // ============================================
    // STORE ALL LEAVES
    // ============================================

    let allLeaves = [];


    // ============================================
    // LOAD LEAVE REQUESTS
    // ============================================

    async function loadLeaves() {

        try {

            const response =
                await fetch(
                    "/api/leaves",
                    {

                        method: "GET",

                        headers: {

                            "Authorization":
                                `Bearer ${token}`,

                            "Content-Type":
                                "application/json"

                        }

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Failed to load leave requests"
                );

            }


            allLeaves =
                data;


            displayLeaves(
                allLeaves
            );


        } catch (error) {

            showMessage(
                error.message,
                "error"
            );

        }

    }


    // ============================================
    // CALCULATE LEAVE DAYS
    // ============================================

    function calculateDays(
        fromDate,
        toDate
    ) {

        const start =
            new Date(fromDate);

        const end =
            new Date(toDate);


        start.setHours(
            0,
            0,
            0,
            0
        );

        end.setHours(
            0,
            0,
            0,
            0
        );


        const difference =
            end.getTime() -
            start.getTime();


        return Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        ) + 1;

    }


    // ============================================
    // DISPLAY LEAVES
    // ============================================

    function displayLeaves(
        leaves
    ) {

        const tableBody =
            document.getElementById(
                "leaveTableBody"
            );


        tableBody.innerHTML = "";


        if (
            !leaves ||
            leaves.length === 0
        ) {

            tableBody.innerHTML = `

                <tr>

                    <td
                        colspan="9"
                        class="no-data">

                        No leave requests found.

                    </td>

                </tr>

            `;

            return;

        }


        leaves.forEach(
            (leave) => {

                const row =
                    document.createElement(
                        "tr"
                    );


                const days =
                    calculateDays(
                        leave.fromDate,
                        leave.toDate
                    );


                let statusClass =
                    "pending";


                if (
                    leave.status ===
                    "Approved"
                ) {

                    statusClass =
                        "approved";

                }


                if (
                    leave.status ===
                    "Rejected"
                ) {

                    statusClass =
                        "rejected";

                }


                let actionButtons =
                    "-";


                if (
                    leave.status ===
                    "Pending"
                ) {

                    actionButtons = `

                        <div class="action-buttons">

                            <button
                                class="approve-btn"
                                onclick="updateLeaveStatus(
                                    '${leave._id}',
                                    'Approved'
                                )">

                                Approve

                            </button>


                            <button
                                class="reject-btn"
                                onclick="updateLeaveStatus(
                                    '${leave._id}',
                                    'Rejected'
                                )">

                                Reject

                            </button>

                        </div>

                    `;

                }


                row.innerHTML = `

                    <td>
                        ${escapeHtml(
                            leave.employeeId
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            leave.employeeName
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            leave.leaveType
                        )}
                    </td>

                    <td>
                        ${formatDate(
                            leave.fromDate
                        )}
                    </td>

                    <td>
                        ${formatDate(
                            leave.toDate
                        )}
                    </td>

                    <td>
                        ${days}
                    </td>

                    <td>
                        ${escapeHtml(
                            leave.reason
                        )}
                    </td>

                    <td>

                        <span
                            class="status ${statusClass}">

                            ${escapeHtml(
                                leave.status
                            )}

                        </span>

                    </td>

                    <td>
                        ${actionButtons}
                    </td>

                `;


                tableBody.appendChild(
                    row
                );

            }
        );

    }


    // ============================================
    // FILTER LEAVES
    // ============================================

    function filterLeaves() {

        const selectedStatus =
            document.getElementById(
                "statusFilter"
            ).value;


        if (
            selectedStatus ===
            "All"
        ) {

            displayLeaves(
                allLeaves
            );

            return;

        }


        const filteredLeaves =
            allLeaves.filter(
                (leave) =>
                    leave.status ===
                    selectedStatus
            );


        displayLeaves(
            filteredLeaves
        );

    }


    // ============================================
    // APPROVE OR REJECT LEAVE
    // ============================================

    async function updateLeaveStatus(
        leaveId,
        status
    ) {

        const action =
            status === "Approved"
                ? "approve"
                : "reject";


        const confirmed =
            confirm(
                `Are you sure you want to ${action} this leave request?`
            );


        if (!confirmed) {

            return;

        }


        try {

            const response =
                await fetch(
                    `/api/leaves/${leaveId}`,
                    {

                        method: "PUT",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${token}`

                        },

                        body:
                            JSON.stringify({

                                status:
                                    status

                            })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Failed to update leave"
                );

            }


            showMessage(
                data.message,
                "success"
            );


            await loadLeaves();

        } catch (error) {

            showMessage(
                error.message,
                "error"
            );

        }

    }


    // ============================================
    // FORMAT DATE
    // ============================================

    function formatDate(
        dateValue
    ) {

        if (!dateValue) {

            return "-";

        }


        const date =
            new Date(dateValue);


        return date.toLocaleDateString(
            "en-IN"
        );

    }


    // ============================================
    // ESCAPE HTML
    // ============================================

    function escapeHtml(
        value
    ) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    // ============================================
    // SHOW MESSAGE
    // ============================================

    function showMessage(
        message,
        type
    ) {

        const messageBox =
            document.getElementById(
                "message"
            );


        messageBox.textContent =
            message;


        messageBox.className =
            `message ${type}`;


        messageBox.style.display =
            "block";


        setTimeout(
            function () {

                messageBox.style.display =
                    "none";

            },
            4000
        );

    }


    // ============================================
    // LOGOUT
    // ============================================

    function logout() {

        localStorage.removeItem(
            "token"
        );

        localStorage.removeItem(
            "currentUser"
        );


        window.location.href =
            "index.html";

    }


    // ============================================
    // LOAD LEAVE REQUESTS
    // ============================================

    loadLeaves();


</script>


</body>

</html>
